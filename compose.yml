services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shorten
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
